services:
  postgres_db:
    image: postgres:13
    container_name: loteria_db_container
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    depends_on:
      - postgres_db
    restart: always
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  postgres_data:
